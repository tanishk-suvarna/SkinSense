[build]
  # The site is served as static files; the classifier runs in the browser
  # via TensorFlow.js using the converted model in public/model.
  publish = "public"
  command = "rm -rf public/static && cp -r static public/static"

[build.environment]
  # Python 3.11.9 (from runtime.txt) has no GitHub artifact attestations,
  # which makes mise fail to install it during dependency installation.
  MISE_PYTHON_GITHUB_ATTESTATIONS = "false"

[[redirects]]
  from = "/try_now"
  to = "/q2/"
  status = 301

[[redirects]]
  from = "/learn.html"
  to = "/learn/"
  status = 301
