    }
    @keyframes fadeInUp {
      0% { opacity: 0; transform: translateY(40px); }
      100% { opacity: 1; transform: translateY(0); }

    .btn-primary {
      background: linear-gradient(90deg, #009961 0%, #00b371 100%);

      font-weight: 700;

      border-radius: 32px;

      transform: translateY(-2px) scale(1.03);
    }
    .alert {
      font-size: 1.25rem;
      border-radius: 14px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.09);
      border: none;
      padding: 22px 24px;
      margin-bottom: 0.5rem;
      animation: fadeInUp 0.7s cubic-bezier(.39,.575,.56,1.000) both;
      font-weight: 600;
      letter-spacing: 0.2px;
    }
    .alert-danger {
      background: linear-gradient(90deg, #ff5858 0%, #ffb199 100%);
      color: #fff;
      border-left: 6px solid #ff5858;
    }
    .alert-success {
      background: linear-gradient(90deg, #43e97b 0%, #38f9d7 100%);
      color: #222;
      border-left: 6px solid #43e97b;
    }
    .alert-warning {

      border-left: 6px solid #f7971e;
    }
    .img-fluid.rounded.shadow-sm.border {
      border-radius: 20px !important;
      box-shadow: 0 4px 24px rgba(0,153,97,0.13);
      border: 2px solid #e3e3e3;

    .img-fluid.rounded.shadow-sm.border:hover {
      box-shadow: 0 8px 32px rgba(0,153,97,0.19);
    }
    .form-label {

      color: #009961;

    }
    .container.mb-5 {
      background: #f8f9fa;
      border-radius: 18px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.06);
      padding: 36px 28px 22px 28px;
      margin-top: 36px;

    .diagnosis-title {
      font-size: 2rem;
      font-weight: 800;
      color: #009961;
      margin-bottom: 18px;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 8px rgba(0,153,97,0.07);
    }
    .breadcrumbs {
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.04);
      background: #f4fdf9;
    }

          <li><a href="/">Home</a></li>

          <li>Diagnosis Results</li>
        </ol>
        <h2>Diagnosis Results</h2>

    <!-- ======= Upload Form Section ======= -->
    <section class="container mb-5">
      <div class="card shadow-sm p-4" style="border-radius: 20px; background: #fff; max-width: 520px; margin: 0 auto;">

        <div class="row gy-4 align-items-center">

          <!-- Diagnosis Card -->

                <span id="result-info"></span>
              </div>
              <div class="progress my-3" style="height: 22px; border-radius: 12px;">
                <div id="confidence-bar" class="progress-bar bg-success" role="progressbar" style="font-weight: 700; font-size: 1.1rem; border-radius: 12px; width: 0;" aria-valuemin="0" aria-valuemax="100"></div>
              </div>
              <p class="mb-0 text-muted">Model confidence</p>
            </div>

  <!-- In-browser classification with TensorFlow.js -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
  <script>
    (function() {
      var cancerClasses = [
        'Actinic keratoses and intraepithelial carcinomae',
        'Basal Cell Carcinoma',
        'Benign Keratosis',
        'Dermatofibroma',
        'Melanocytic Nevus',
        'Vascular Lesion',
        'Melanoma'
      ];
      var cancerInfo = {
        'Actinic keratoses and intraepithelial carcinomae': "Precancerous, rough, scaly patches on sun-exposed skin. Early treatment can prevent progression to squamous cell carcinoma.",
        'Basal Cell Carcinoma': "The most common skin cancer. Grows slowly and rarely spreads, but can cause local damage if untreated.",
        'Benign Keratosis': "Non-cancerous skin growths, often appearing as warty or waxy spots. Generally harmless but can resemble skin cancer.",
        'Dermatofibroma': "A benign, firm bump often found on the legs. Not dangerous and usually does not require treatment.",
        'Melanocytic Nevus': "Commonly known as a mole. Most are harmless, but changes in size, color, or shape should be checked by a doctor.",
        'Vascular Lesion': "Abnormal blood vessels in the skin, usually benign. Some types may require monitoring or treatment.",
        'Melanoma': "A serious form of skin cancer that can spread rapidly. Early detection and treatment are critical for a good outcome. See a dermatologist promptly if suspected."
      };

      var form = document.getElementById('diagnose-form');
      var fileInput = document.getElementById('file');
      var button = document.getElementById('diagnose-btn');
      var status = document.getElementById('diagnose-status');
      var modelPromise = null;

      function getModel() {
        if (!modelPromise) {
          modelPromise = tf.loadLayersModel('/model/model.json').catch(function(err) {
            modelPromise = null;
            throw err;
          });
        }
        return modelPromise;
      }

      function loadImage(file) {
        return new Promise(function(resolve, reject) {
          var img = new Image();
          img.onload = function() { resolve(img); };
          img.onerror = function() { reject(new Error('Could not read that image file.')); };
          img.src = URL.createObjectURL(file);
        });
      }

      function showResult(img, label, confidence) {
        document.getElementById('result-image').src = img.src;
        document.getElementById('result-diagnosis').textContent = label;
        document.getElementById('result-info').textContent = cancerInfo[label] || 'No additional information available.';
        var alertEl = document.getElementById('result-alert');
        alertEl.className = 'alert ' + (label.indexOf('Melanoma') !== -1 ? 'alert-danger' : label.indexOf('Benign') !== -1 ? 'alert-success' : 'alert-warning');
        var bar = document.getElementById('confidence-bar');
        bar.textContent = confidence + '%';
        bar.style.width = confidence + '%';
        bar.setAttribute('aria-valuenow', confidence);
        var section = document.getElementById('diagnosis-results');
        section.hidden = false;
        section.scrollIntoView({ behavior: 'smooth' });
      }

      form.addEventListener('submit', function(e) {
        e.preventDefault();
        var file = fileInput.files[0];
        if (!file) return;
        button.disabled = true;
        status.textContent = 'Analyzing image…';
        Promise.all([getModel(), loadImage(file)]).then(function(results) {
          var model = results[0], img = results[1];
          // Match the Flask preprocessing (load_img uses nearest-neighbour): resize to 28x28 RGB and scale to [0, 1]
          var probs = tf.tidy(function() {
            var input = tf.browser.fromPixels(img, 3)
              .resizeNearestNeighbor([28, 28])
              .toFloat()
              .div(255)
              .expandDims(0);
            return model.predict(input).dataSync();
          });
          var best = 0;
          for (var i = 1; i < probs.length; i++) if (probs[i] > probs[best]) best = i;
          showResult(img, cancerClasses[best], Math.round(probs[best] * 100));
          status.textContent = '';
        }).catch(function(err) {
          status.textContent = 'Something went wrong: ' + err.message;
        }).then(function() {
          button.disabled = false;
        });
      });
    })();
  </script>
